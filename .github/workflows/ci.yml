# CI en tres capas (ver docs/operacion/ci.md).
#   1. prompt   : lo que cambia cuando se toca un prompt o un guardrail. Sin modelo, sin costo.
#   2. modelo   : gates de calidad sobre el reporte congelado del último eval real.
#   3. integración: toda la suite contra Postgres+pgvector real (permisos, auditoría, grafo con LLM falso).
# Más: secretos y dependencias. Un cambio de modelo se prueba con evals-live.yml (manual, gasta tokens).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGPASSWORD: ci
  DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/eightd_test

jobs:
  prompt:
    name: 1 · prompt (guardrails, PII, inyección, 16 casos de seguridad)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/api } }
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: eightd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --group dev
      - name: Errores reales de Python (sintaxis, nombres sin definir)
        run: uv run ruff check --select E9,F63,F7,F82 app tests
      - name: Migraciones
        run: |
          for f in $(ls db/migrations/sql/*.sql | sort); do
            psql -q -v ON_ERROR_STOP=1 -h localhost -U postgres -d eightd_test -f "$f"
          done
      - name: Guardrails, PII, clasificador y los 16 casos PER/ADV
        run: >-
          uv run pytest -q
          tests/agent/graph/test_guardrails.py
          tests/agent/graph/test_security_gates_db.py
          tests/test_confidentiality_classifier.py
          tests/test_confidentiality_redactor.py
          tests/test_security_manifest.py

  promptfoo:
    name: 1b · Promptfoo (controles deterministas, sin modelo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      PROMPTFOO_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: "Entorno de Python de la API (el proveedor importa app.*)"
        working-directory: apps/api
        run: uv sync --group dev
      - name: "Tolerancia cero (104 casos: ADV, falsos positivos de entrada y de salida, 1288 párrafos del corpus)"
        working-directory: evals/promptfoo
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/apps/api/.venv/bin/python
        run: >-
          npx --yes promptfoo@0.124.1 eval -c core.yaml
          -o reportes/promptfoo-core.json -o reportes/promptfoo-core.html
      - name: "Regresión: variantes de desarrollo (21, ya vistas por el detector)"
        working-directory: evals/promptfoo
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/apps/api/.venv/bin/python
          PROMPTFOO_PASS_RATE_THRESHOLD: "100"
        run: >-
          npx --yes promptfoo@0.124.1 eval -c variantes.yaml
          -o reportes/promptfoo-variantes.json -o reportes/promptfoo-variantes.html
      - name: "Validación v2 (32 ataques, estimación optimista; no puede bajar de la línea base)"
        working-directory: evals/promptfoo
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/apps/api/.venv/bin/python
          # Línea base 19 oct 2026: 20 de 32 (62.5 %). Si el detector mejora, sube este número en el mismo PR.
          PROMPTFOO_PASS_RATE_THRESHOLD: "62"
        run: >-
          npx --yes promptfoo@0.124.1 eval -c validacion.yaml
          -o reportes/promptfoo-validacion.json -o reportes/promptfoo-validacion.html
      - name: "Guardrails de salida: regresión (culpa y cierre de v1 y v2)"
        working-directory: evals/promptfoo
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/apps/api/.venv/bin/python
          # Línea base: 43 de 44 (97.7 %). El que falla es un caso ya visto que los patrones no cubren.
          PROMPTFOO_PASS_RATE_THRESHOLD: "97"
        run: >-
          npx --yes promptfoo@0.124.1 eval -c salida_regresion.yaml
          -o reportes/promptfoo-salida-regresion.json -o reportes/promptfoo-salida-regresion.html
      - name: "Guardrails de salida: validación v3 (8 de 24; no puede bajar)"
        working-directory: evals/promptfoo
        env:
          PROMPTFOO_PYTHON: ${{ github.workspace }}/apps/api/.venv/bin/python
          PROMPTFOO_PASS_RATE_THRESHOLD: "33"
        run: >-
          npx --yes promptfoo@0.124.1 eval -c salida_validacion.yaml
          -o reportes/promptfoo-salida-validacion.json -o reportes/promptfoo-salida-validacion.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-promptfoo
          path: evals/promptfoo/reportes/

  modelo:
    name: 2 · modelo (gates sobre el reporte congelado)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --group dev
      - name: Gates bloqueantes (no llama al modelo)
        run: |
          test -f ../../evals/reportes/agente.json || {
            echo "::error::Falta evals/reportes/agente.json. Congela el último reporte válido (ver docs/operacion/ci.md). Sin dato no se aprueba."
            exit 1
          }
          uv run python -m app.evalkit.gates --out-dir ../../evals/reportes --variant con_enlaces --split dev
      - name: Resumen en la página del run
        if: always()
        run: |
          f=../../evals/reportes/agente.gates.md
          test -f "$f" && cat "$f" >> "$GITHUB_STEP_SUMMARY" || true

  integracion:
    name: 3 · integración (Postgres + pgvector reales)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/api } }
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: eightd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --group dev
      - name: Migraciones (SQL en orden)
        run: |
          for f in $(ls db/migrations/sql/*.sql | sort); do
            psql -q -v ON_ERROR_STOP=1 -h localhost -U postgres -d eightd_test -f "$f"
          done
      - name: Suite completa
        run: uv run pytest -q
      - name: La cadena de auditoría se verifica
        run: psql -h localhost -U postgres -d eightd_test -c "SELECT * FROM audit_verify()"

  secretos:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Dependencias con vulnerabilidades conocidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No bloquea: el aviso es la señal; se vuelve bloqueante cuando haya lockfile versionado.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit sobre lo que uv resolvería
        working-directory: apps/api
        run: |
          uv export --no-hashes --no-emit-project --group dev -o /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --disable-pip

  web:
    name: Web (tipos y lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint