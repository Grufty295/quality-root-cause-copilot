# Cambio de modelo o de prompt con efecto en calidad: corrida REAL, a mano. Gasta tokens (~US$0.15 el humo).
# Proveedor a elegir al lanzarlo: openrouter (secreto OPENROUTER_API_KEY) u openai (secreto OPENAI_API_KEY).
# Modelo y precios: los inputs de la corrida; si van vacíos, las variables del repo LLM_MODEL, LLM_PRICE_IN, LLM_PRICE_OUT.
# No corre en PR para no pagar por cada push.
# GIT_SHA (7 caracteres del commit) se exporta al entorno: el reporte queda atado a un commit (`código <sha>`).
# Rutas: el código usa /workspace/... (montaje del compose); en el runner se pasan --data y --evals explícitos.
# 1a corrida en Actions (19 oct 2026): fallo por /workspace/data/seed inexistente -> corregido. Escrito contra los comandos del Makefile; ajusta variables LLM_* a tu .env.example.
name: evals-live

on:
  workflow_dispatch:
    inputs:
      casos:
        description: "Casos separados por coma"
        default: "EV-01,EV-05,EV-09"
      proveedor:
        description: "Proveedor del modelo"
        type: choice
        options: [openrouter, openai]
        default: openrouter
      modelo:
        description: "Modelo (vacío = variable LLM_MODEL del repo)"
        default: ""
      precio_in:
        description: "USD por millón de tokens de entrada (vacío = LLM_PRICE_IN)"
        default: ""
      precio_out:
        description: "USD por millón de tokens de salida (vacío = LLM_PRICE_OUT)"
        default: ""
      razonamiento:
        description: "Modelo de razonamiento de OpenAI (o-series, GPT-5): usa max_completion_tokens y no envía temperature"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: apps/api } }
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: eightd }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: ci
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/eightd
      LLM_ALLOW_SIMULATED_LOCAL: "true"
      LLM_LOCAL__SIMULATED: "true"
      LLM_LOCAL__BASE_URL: ${{ inputs.proveedor == 'openai' && 'https://api.openai.com/v1' || 'https://openrouter.ai/api/v1' }}
      LLM_LOCAL__API_KEY: ${{ inputs.proveedor == 'openai' && secrets.OPENAI_API_KEY || secrets.OPENROUTER_API_KEY }}
      LLM_LOCAL__PROVIDER_LABEL: ${{ inputs.proveedor == 'openai' && 'openai-simula-local' || 'openrouter-simula-local' }}
      LLM_LOCAL__MODEL_SMALL: ${{ inputs.modelo || vars.LLM_MODEL }}
      LLM_LOCAL__MODEL_LARGE: ${{ inputs.modelo || vars.LLM_MODEL }}
      LLM_LOCAL__TIMEOUT_S: "180"
      LLM_LOCAL__PRICE_IN_PER_MTOK: ${{ inputs.precio_in || vars.LLM_PRICE_IN }}
      LLM_LOCAL__PRICE_OUT_PER_MTOK: ${{ inputs.precio_out || vars.LLM_PRICE_OUT }}
      # `provider` es de OpenRouter: OpenAI lo rechaza, así que con OpenAI va vacío.
      LLM_LOCAL__EXTRA_BODY: ${{ inputs.proveedor == 'openai' && '{}' || '{"provider":{"data_collection":"deny"}}' }}
      LLM_LOCAL__TOKEN_PARAM: ${{ inputs.razonamiento && 'max_completion_tokens' || 'max_tokens' }}
      LLM_LOCAL__SEND_TEMPERATURE: ${{ inputs.razonamiento && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verifica llave y modelo
        run: |
          if [ -z "$LLM_LOCAL__API_KEY" ]; then
            echo "::error::Falta el secreto de ${{ inputs.proveedor }} (OPENROUTER_API_KEY u OPENAI_API_KEY) en Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$LLM_LOCAL__MODEL_SMALL" ]; then
            echo "::error::Falta el modelo: pásalo en el input 'modelo' o define la variable LLM_MODEL del repo."
            exit 1
          fi
      - name: Versión del código en el reporte
        run: echo "GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --group dev
      - name: Migraciones
        run: |
          for f in $(ls db/migrations/sql/*.sql | sort); do
            psql -q -v ON_ERROR_STOP=1 -h localhost -U postgres -d eightd -f "$f"
          done
      - name: Seed (descarga el modelo de embeddings)
        run: uv run python -m app.seed --data "${{ github.workspace }}/data/seed"
      - name: Eval del agente
        run: uv run python -m app.evalkit.agent --name ci-humo --evals "${{ github.workspace }}/evals" --casos "${{ inputs.casos }}" --variants con_enlaces --repeats 1 --concurrency 3 --out-dir "${{ github.workspace }}/reporte"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-eval
          path: reporte/