[alembic]
# %(here)s: la ruta es relativa a este archivo, no al directorio desde donde se corre alembic.
script_location = %(here)s/db/migrations
# Permite que env.py importe `app` desde apps/api, esté quien esté como cwd.
prepend_sys_path = %(here)s
# La URL sale de DATABASE_URL (ver db/migrations/env.py), no de este archivo.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
