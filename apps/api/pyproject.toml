[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebastian Audetat", email = "sebastian.audetat.f@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

# Es una aplicación (se ejecuta desde el código, `uvicorn app.main:app`), no una biblioteca instalable.
# Sin esto uv intenta construir el paquete `api` y falla: no existe src/api/__init__.py.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
# Juez de los evals semánticos (app/evalkit/semantic.py). Fuera de la imagen por defecto:
# make build-evals los instala. Versiones fijas: sus APIs cambian entre menores.
evals = [
    "deepeval==4.3.0",
    "ragas==0.4.3",
    # ragas 0.4.3 importa langchain_community.chat_models.vertexai, que la 0.4 eliminó.
    "langchain-community<0.4",
]
# Exportador de trazas (TRACE_EXPORTER=langfuse, app/agent/observe.py).
observabilidad = [
    "langfuse==5.0.1",
]
